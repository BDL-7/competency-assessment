{% macro icon(name, class_name='') -%}
<svg class="icon {{ class_name }}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'overview' %}<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="11" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="18" width="7" height="3" rx="1"/>
{% elif name == 'queue' %}<rect x="4" y="5" width="16" height="16" rx="3"/><path d="M9 5V3h6v2M8 11h8M8 16h5"/>
{% elif name == 'guide' %}<path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H4zM13 7a3 3 0 0 1 3-3h4v15h-3a4 4 0 0 0-4 2"/>
{% elif name == 'equipment' %}<rect x="4" y="4" width="16" height="12" rx="3"/><path d="M8 20h8M12 16v4M8 9h2M14 9h2M8 12h8"/>
{% elif name == 'arrow' %}<path d="M5 12h14M13 6l6 6-6 6"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'history' %}<path d="M3 11a9 9 0 1 1 2 7M3 5v6h6M12 7v5l4 2"/>
{% elif name == 'search' %}<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>
{% elif name == 'shield' %}<path d="m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6zM8 12l3 3 5-6"/>
{% elif name == 'message' %}<path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6 3V6a2 2 0 0 1 2-2zM7 9h10M7 13h6"/>
{% elif name == 'person' %}<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
{% elif name == 'lab' %}<path d="M9 3h6M10 3v8L4 21h16l-6-10V3M7 16h10"/><circle cx="11" cy="18" r=".5"/><path d="M16 7h4M18 5v4"/>
{% elif name == 'spark' %}<path d="M5 5h14v14H5zM9 9h6M9 12h6M9 15h3"/>
{% else %}<path d="M7 3h7l4 4v14H7zM14 3v5h4M10 12h5M10 16h5"/>
{% endif %}
</svg>
{%- endmacro %}

{% macro record_link(row, diagnostic) -%}
<a class="record-link" href="{{ url_for('web.detail', record_id=row.id, **diagnostic) }}">
  <span class="avatar avatar-sage">{{ icon('person') }}</span>
  <span><strong>{{ row.employee }}</strong><small>{{ row.id }}</small></span>
</a>
{%- endmacro %}
